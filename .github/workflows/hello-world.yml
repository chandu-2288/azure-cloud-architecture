name: My First GitHub Actions Pipeline

# 1. This tells GitHub WHAT triggers the pipeline (When you push code)
on: [push]

jobs:
  # 2. This is the name of our work environment
  say-hello-job:
    # 3. This tells GitHub to run the code on a fresh cloud machine running Ubuntu Linux
    runs-on: ubuntu-latest

    # 4. These are the individual steps the machine will execute
    steps:
      - name: Step 1 - Check out the repository code
        uses: actions/checkout@v4

      - name: Step 2 - Print a welcome message
        run: echo "Hello World! My GitHub Actions runner is alive! 🚀"

      - name: Step 3 - Check the current server time
        run: date
